name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: crm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check deployment configuration
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          for name in TS_OAUTH_CLIENT_ID TS_AUDIENCE SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:crm-deploy
          ping: 100.72.62.103

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.72.62.103
          fingerprint: SHA256:9imM898/0vNe+axIFVna6rKXFUL0XPWOjxrtp37MMBE
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            cd /opt/emeb-crm
            test -z "$(git status --porcelain)"
            git fetch origin main
            target="${{ github.sha }}"
            if [ "$(git rev-parse origin/main)" != "$target" ]; then
              echo "A newer main commit is waiting for deployment."
              exit 0
            fi
            git merge-base --is-ancestor HEAD "$target"
            previous=$(git rev-parse HEAD)
            git switch main
            git merge --ff-only "$target"
            if git diff --quiet "$previous" HEAD -- apps/backend apps/frontend docker-compose.yml; then
              echo "Application already deployed; repository aligned with main."
            else
              docker compose build
              docker compose up -d --no-build
            fi
