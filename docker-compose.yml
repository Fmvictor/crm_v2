services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: emeb-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emeb-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: emeb-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - emeb-network

  postgres:
    image: postgres:16-alpine
    container_name: emeb-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emeb_crm}
      POSTGRES_USER: ${POSTGRES_USER:-emeb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-emeb} -d ${POSTGRES_DB:-emeb_crm}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emeb-network

  redis:
    image: redis:7-alpine
    container_name: emeb-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emeb-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  emeb-network:
    driver: bridge
